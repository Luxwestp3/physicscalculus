        { id: 'tr-1', subject: 'physics', trigger: 'Переменная масса (ракета, капля, песок)', action: 'Уравнение Мещерского $m\\,dv/dt = F_{\\text{внеш}} + u_{\\text{отн}}\\,dm/dt$. Для энергии газов — интегрируй в неподвижной ИСО с $(v-u)^2$.' },
        { id: 'tr-2', subject: 'physics', trigger: 'Шар/цилиндр катится и отрывается от поверхности', action: 'ЗСЭ с $I\\omega^2/2$ + радиус ЦМ $(R-r)$ + условие отрыва $N=0$. После отрыва $\\omega = \\text{const}$, в высоту идёт только $v_y^2/(2g)$.' },
        { id: 'tr-3', subject: 'physics', trigger: 'Удар с прилипанием и началом вращения тела', action: '1) ЗСИ → найти скорости; 2) координаты нового ЦМ; 3) $I_C$ через Штейнера; 4) ЗСМИ относительно нового ЦМ.' },
        { id: 'tr-4', subject: 'physics', trigger: 'Сила зависит от скорости $F(v)$ или координаты $F(x)$', action: 'Пиши $a = dv/dt$ (если нужно $v(t)$) или $a = v\\,dv/dx$ (если нужно $v(x)$) → разделяй переменные.' },
        { id: 'tr-5', subject: 'math',    trigger: 'Предел $(a_n)^{b_n}$ при $n\\to\\infty$', action: 'СНАЧАЛА проверь предел основания! Если $a_n \\to q \\neq 1$, это НЕ $1^\\infty$ и НЕ второй замечательный.' },
        { id: 'tr-6', subject: 'math',    trigger: 'Рекуррента $x_{n+1}=f(x_n)$, просят доказать существование предела', action: 'Вейерштрасс: 1) прикинь $L=f(L)$ в черновике; 2) докажи ограниченность числом $L$ по индукции; 3) докажи монотонность; 4) перейди к пределу.' },
        { id: 'tr-7', subject: 'algebra', trigger: 'Сухое абстрактное определение (кольцо, идеал, фактор, ОГИ)', action: 'НЕ медитируй 3 часа! Подставь 2 простых примера ($\\mathbb{Z}$, $\\mathbb{R}[x]$) и 1 контрпример (где аксиома ломается) → иди дальше.' },
      ]
    };

    // =========================================================================
    // СОСТОЯНИЕ И ХРАНИЛИЩЕ
    // =========================================================================
    function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return deepClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...deepClone(DEFAULT_STATE),
          ...parsed,
          subjectItems: { ...deepClone(DEFAULT_STATE.subjectItems), ...(parsed.subjectItems || {}) }
        };
      } catch (e) {
        return deepClone(DEFAULT_STATE);
      }
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    // =========================================================================
    // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // =========================================================================
    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function uid(prefix) {
      return prefix + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
    }

    function daysUntil(iso) {
      const now = new Date();
      const target = new Date(iso);
      const diffMs = target - now;
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    function detectCurrentPhase() {
      if (state.activePhaseOverride) return state.activePhaseOverride;
      const now = new Date();
      if (now < new Date('2026-12-17T00:00:00')) return 1;
      if (now <= new Date('2026-12-28T23:59:59')) return 2;
      return 3;
    }

    function colorBadge(color) {
      const map = {
        indigo:  'bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 border-indigo-500/25',
        amber:   'bg-amber-500/15 text-amber-700 dark:text-amber-300 border-amber-500/25',
        emerald: 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border-emerald-500/25',
        teal:    'bg-teal-500/15 text-teal-700 dark:text-teal-300 border-teal-500/25',
        violet:  'bg-violet-500/15 text-violet-700 dark:text-violet-300 border-violet-500/25',
        rose:    'bg-rose-500/15 text-rose-700 dark:text-rose-300 border-rose-500/25',
        slate:   'bg-slate-500/15 text-slate-600 dark:text-slate-300 border-slate-500/25',
      };
      return map[color] || map.slate;
    }

    function statusMeta(st, mode = 'task') {
      if (mode === 'physics') {
        const m = {
          todo:  { label: 'Не смотрел',     cls: 'bg-slate-500/15 text-slate-500 dark:text-slate-400 border-slate-500/25', next: 'stuck' },
          stuck: { label: 'Тупик (7 мин)',  cls: 'bg-rose-500/15 text-rose-600 dark:text-rose-300 border-rose-500/30',     next: 'doing' },
          doing: { label: 'Понял приём',    cls: 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border-amber-500/30', next: 'done'  },
          done:  { label: 'Решил сам ✓',    cls: 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border-emerald-500/30', next: 'todo' },
        };
        return m[st] || m.todo;
      }
      const m = {
        todo:  { label: 'Не начато', cls: 'bg-slate-500/15 text-slate-600 dark:text-slate-400 border-slate-500/25', next: 'doing' },
        doing: { label: 'В процессе', cls: 'bg-amber-500/15 text-amber-700 dark:text-amber-300 border-amber-500/30', next: 'done'  },
        done:  { label: 'Готово ✓',   cls: 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 border-emerald-500/30', next: 'todo' },
      };
      return m[st] || m.todo;
    }

    function toast(msg) {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'px-3.5 py-2 rounded-xl text-xs font-medium bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 shadow-lg border border-slate-700 dark:border-slate-300 transition-opacity duration-300';
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2200);
    }

    function renderMath() {
      if (typeof renderMathInElement === 'function') {
        try {
          renderMathInElement(document.getElementById('app-root'), {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
            ],
            throwOnError: false,
          });
        } catch (e) {}
      }
    }

    // =========================================================================
    // ТАЙМЕР («ПРАВИЛО 7 МИНУТ» И ФОКУС-БЛОКИ)
    // =========================================================================
    const timer = {
      totalSec: 7 * 60,
      leftSec: 7 * 60,
      label: 'Правило 7 минут (идея задачи)',
      running: false,
      interval: null,
    };

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    function setTimerPreset(mins, label) {
      clearInterval(timer.interval);
      timer.running = false;
      timer.totalSec = mins * 60;
      timer.leftSec = mins * 60;
      timer.label = label;
      updateTimerDOM();
    }

    function toggleTimer() {
      if (timer.running) {
        clearInterval(timer.interval);
        timer.running = false;
      } else {
        if (timer.leftSec <= 0) timer.leftSec = timer.totalSec;
        timer.running = true;
        timer.interval = setInterval(() => {
          timer.leftSec -= 1;
          if (timer.leftSec <= 0) {
            clearInterval(timer.interval);
            timer.running = false;
            timer.leftSec = 0;
            playBeep();
            toast('Время вышло: ' + timer.label);
          }
          updateTimerDOM();
        }, 1000);
      }
      updateTimerDOM();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function updateTimerDOM() {
      const disp = document.getElementById('timer-display');
      const lbl = document.getElementById('timer-label');
      const btn = document.getElementById('timer-toggle-btn');
      const bar = document.getElementById('timer-bar');
      if (!disp) return;
      disp.textContent = formatTime(timer.leftSec);
      lbl.textContent = timer.label;
      btn.textContent = timer.running ? 'Пауза' : (timer.leftSec === 0 ? 'Заново' : 'Старт');
      const pct = timer.totalSec ? Math.round(((timer.totalSec - timer.leftSec) / timer.totalSec) * 100) : 0;
      bar.style.width = pct + '%';
    }

    // =========================================================================
    // ТЕМА И ШАПКА
    // =========================================================================
    function applyTheme() {
      const isDark = state.theme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
    }

    function renderHeader() {
      const phase = detectCurrentPhase();
      const phaseInfo = PHASES_INFO.find(p => p.id === phase);
      document.getElementById('phase-pill').textContent = `Фаза ${phase}`;

      const upcoming = MILESTONES.find(m => daysUntil(m.date) >= 0) || MILESTONES[MILESTONES.length - 1];
      const d = daysUntil(upcoming.date);
      const dText = d > 0 ? `через ${d} дн.` : (d === 0 ? 'СЕГОДНЯ' : 'прошло');
      document.getElementById('next-event-banner').textContent = `Ближайшее: ${upcoming.title} (${upcoming.dateLabel}) — ${dText}`;

      const tabs = [
        { id: 'today',    label: '⚡ Сегодня' },
        { id: 'roadmap',  label: '🗺 План (3 фазы)' },
        { id: 'subjects', label: '📚 Предметы' },
        { id: 'tricks',   label: '🧠 Лог приёмов' },
      ];
      document.getElementById('main-nav').innerHTML = tabs.map(t => {
        const active = state.activeTab === t.id;
        return `<button type="button" onclick="switchTab('${t.id}')" class="px-3.5 py-2.5 text-xs sm:text-sm font-medium border-b-2 whitespace-nowrap transition ${
          active
            ? 'border-indigo-500 text-indigo-600 dark:text-indigo-400'
            : 'border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200'
        }">${t.label}</button>`;
      }).join('');
    }

    // =========================================================================
    // РЕНДЕР ВКЛАДКИ 1: «СЕГОДНЯ»
    // =========================================================================
    function renderTodayTab() {
      const phase = detectCurrentPhase();
      const pInfo = PHASES_INFO.find(p => p.id === phase);

      const todayTasks = state.tasks.filter(t => t.today && t.status !== 'done');
      const phaseTasks = state.tasks.filter(t => t.phase === phase && t.status !== 'done');
      const kdzDone = state.mathKdz.filter(k => k.done).length;

      // Карточки обратного отсчёта
      const countdownHtml = MILESTONES.map(m => {
        const d = daysUntil(m.date);
        const isPast = d < 0;
        const isUrgent = d >= 0 && d <= 7;
        return `
          <div class="rounded-xl p-3 border transition ${
            isPast
              ? 'bg-slate-100/60 dark:bg-slate-900/40 border-slate-200 dark:border-slate-800 opacity-50'
              : isUrgent
                ? 'bg-rose-500/10 border-rose-500/40'
                : 'bg-white dark:bg-slate-900/80 border-slate-200 dark:border-slate-800'

            <div class="flex items-center justify-between gap-1">
              <span class="text-[11px] font-semibold uppercase tracking-wide ${isUrgent ? 'text-rose-500' : 'text-slate-500 dark:text-slate-400'}">${esc(m.dateLabel)}</span>
              <span class="font-mono text-xs font-bold px-1.5 py-0.5 rounded ${isPast ? 'bg-slate-500/15 text-slate-400' : colorBadge(m.color)}">${isPast ? '✓' : (d === 0 ? '0д' : d + 'д')}</span>
            </div>
            <div class="font-semibold text-sm mt-1 truncate">${esc(m.title)}</div>
            <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${esc(m.consult)}</div>
          </div>
        `;
      }).join('');

      // Список задач "На сегодня"
      const renderTaskRow = (t) => {
        const subj = SUBJECTS_META[t.subject] || SUBJECTS_META.other;
        const sm = statusMeta(t.status);
        return `
          <div class="group flex items-start gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/60 hover:border-indigo-500/40 transition">
            <button type="button" onclick="cycleTaskStatus('${t.id}')" class="mt-0.5 shrink-0 px-2 py-0.5 rounded-md text-[11px] font-medium border ${sm.cls} transition" title="Клик — сменить статус">
              ${sm.label}
            </button>
            <div class="min-w-0 flex-1">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold border ${colorBadge(subj.color)}">${subj.short}</span>
                <span class="text-sm font-medium ${t.status === 'done' ? 'line-through text-slate-400' : ''}">${esc(t.title)}</span>
              </div>
              ${t.note ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${esc(t.note)}</p>` : ''}
              ${t.due ? `<span class="inline-block font-mono text-[10px] text-slate-400 mt-1">до ${esc(t.due)}</span>` : ''}

            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="toggleTaskToday('${t.id}')" class="p-1 rounded hover:bg-slate-200 dark:hover:bg-slate-700 text-sm transition" title="${t.today ? 'Убрать из Сегодня' : 'В Сегодня'}">
                ${t.today ? '★' : '☆'}
              </button>
              <button type="button" onclick="deleteTask('${t.id}')" class="p-1 rounded text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 text-xs opacity-0 group-hover:opacity-100 transition" title="Удалить">
                ✕
              </button>
            </div>
          </div>
        `;
      };

      const todayListHtml = todayTasks.length
        ? todayTasks.map(renderTaskRow).join('')
        : `<div class="p-5 text-center rounded-xl border border-dashed border-slate-300 dark:border-slate-700 text-xs text-slate-500">На сегодня всё закрыто или ничего не выбрано. Нажми ★ у задач ниже или «+ Задача».</div>`;

      const backlogTasks = state.tasks.filter(t => !(t.today && t.status !== 'done'));
      const activePhaseBacklog = backlogTasks.filter(t => t.phase === phase && t.status !== 'done');
      const doneTasks = state.tasks.filter(t => t.status === 'done');

      return `
        <!-- Countdown Strip -->
        <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 mb-6">
          ${countdownHtml}
        </section>

        <!-- Main 2-Column Combat Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <!-- Left 2 cols: Today Focus + Active Phase Queue -->
          <div class="lg:col-span-2 space-y-5">
            <!-- Today Card -->
            <section class="rounded-2xl bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 p-4 sm:p-5">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
                <div>
                  <h2 class="text-base font-bold flex items-center gap-2">
                    <span>⚡ Фокус на сегодня</span>
                    <span class="font-mono text-xs px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-500 dark:text-indigo-300">${todayTasks.length}</span>
                  </h2>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Выбери 2–3 реальных дела, запусти таймер и не распыляйся.</p>
                </div>
                <button type="button" onclick="openTaskModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 dark:bg-slate-800 hover:bg-indigo-500/15 hover:text-indigo-400 border border-slate-200 dark:border-slate-700 transition">
                  + Добавить дело

            </section>

            <!-- Active Phase Backlog -->

              </div>
              ${doneTasks.length ? `
                <details class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800">
                  <summary class="text-xs font-medium text-slate-400 hover:text-slate-200 cursor-pointer">Выполненные задачи (${doneTasks.length}) ▾</summary>
                  <div class="space-y-2 mt-2.5 opacity-70">${doneTasks.map(renderTaskRow).join('')}</div>
                </details>

            </section>
          </div>

          <!-- Right col: Timer + Ignore List + Weekly Anchors -->
          <div class="space-y-5">
            <!-- 7-Minute / Focus Timer -->
            <section class="rounded-2xl bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 p-4 sm:p-5">
              <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-bold">⏱ Таймер анти-тупняка</h3>
                <span class="text-[11px] font-mono text-slate-400">СДВГ-щит</span>
              </div>
              <div class="rounded-xl bg-slate-100 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 p-4 text-center">

                <div id="timer-label" class="text-xs text-slate-500 dark:text-slate-400 mt-1">${esc(timer.label)}</div>
                <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden mt-3">

                <button type="button" onclick="setTimerPreset(5, 'Перерыв 5 мин')" class="px-2 py-1.5 rounded-lg text-[11px] font-medium bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-500/25 border border-emerald-500/25 transition">5 мин · Отдых</button>

              </div>
              <div class="space-y-1.5">

            <input id="tr-trigger" type="text" required placeholder="Вижу в условии..." class="sm:col-span-4 px-3 py-2 rounded-lg text-xs bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700" />
            <input id="tr-action" type="text" required placeholder="Делаю (приём / формула $...$)" class="sm:col-span-4 px-3 py-2 rounded-lg text-xs bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700" />
            <button type="submit" class="sm:col-span-2 px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition">+ Записать</button>
          </form>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
          ${state.tricks.map(tr => {
            const m = SUBJECTS_META[tr.subject] || SUBJECTS_META.other;
            return `
              <div class="group rounded-2xl bg-white dark:bg-slate-900/90 border border-slate-200 dark:border-slate-800 p-4 flex flex-col justify-between gap-2">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="px-2 py-0.5 rounded text-[10px] font-semibold border ${colorBadge(m.color)}">${esc(m.name)}</span>
                    <button type="button" onclick="deleteTrick('${tr.id}')" class="text-xs text-slate-400 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition">✕</button>
                  </div>
                  <div class="text-xs font-semibold text-slate-500 dark:text-slate-400">Если вижу:</div>
                  <div class="text-sm font-medium mt-0.5">${esc(tr.trigger)}</div>
                  <div class="text-xs font-semibold text-indigo-500 dark:text-indigo-400 mt-2">То делаю:</div>
                  <div class="text-xs text-slate-700 dark:text-slate-200 mt-0.5 leading-relaxed">${esc(tr.action)}</div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // ОБРАБОТЧИКИ ДЕЙСТВИЙ
    // =========================================================================
    function render() {
      applyTheme();
      renderHeader();
      const root = document.getElementById('app-root');
      if (state.activeTab === 'today') root.innerHTML = renderTodayTab();
      else if (state.activeTab === 'roadmap') root.innerHTML = renderRoadmapTab();
      else if (state.activeTab === 'subjects') root.innerHTML = renderSubjectsTab();
      else if (state.activeTab === 'tricks') root.innerHTML = renderTricksTab();
      updateTimerDOM();
      renderMath();
    }

    window.switchTab = (tab) => { state.activeTab = tab; saveState(); render(); };
    window.openSubject = (subj) => { state.activeTab = 'subjects'; state.activeSubject = subj; saveState(); render(); };
    window.setPhaseOverride = (p) => { state.activePhaseOverride = p; saveState(); render(); };

    window.cycleTaskStatus = (id) => {
      const t = state.tasks.find(x => x.id === id);
      if (!t) return;
      t.status = statusMeta(t.status).next;
      saveState();
      render();
    };

    window.toggleTaskToday = (id) => {
      const t = state.tasks.find(x => x.id === id);
      if (!t) return;
      t.today = !t.today;
      saveState();
      render();
    };

    window.deleteTask = (id) => {
      state.tasks = state.tasks.filter(x => x.id !== id);
      saveState();
      render();
      toast('Задача удалена');
    };

    window.toggleAnchor = (id) => {
      const a = state.weeklyAnchors.find(x => x.id === id);
      if (!a) return;
      a.done = !a.done;
      saveState();
      render();
    };

    window.resetWeeklyAnchors = () => {
      state.weeklyAnchors.forEach(a => a.done = false);
      saveState();
      render();
      toast('Недельные якоря сброшены');
    };

    window.toggleKdz = (id) => {
      const k = state.mathKdz.find(x => x.id === id);
      if (!k) return;
      k.done = !k.done;
      saveState();
      render();
    };

    window.addSubjectItem = (e, subj) => {
      e.preventDefault();
      const titleEl = document.getElementById('si-title-' + subj);
      const noteEl = document.getElementById('si-note-' + subj);
      const title = titleEl.value.trim();
      if (!title) return;
      state.subjectItems[subj] = state.subjectItems[subj] || [];
      state.subjectItems[subj].unshift({
        id: uid('si'),
        title,
        note: noteEl.value.trim(),
        status: 'todo'
      });
      saveState();
      render();
      toast('Добавлено в ' + SUBJECTS_META[subj].name);
    };

    window.cycleSubjectItem = (subj, id) => {
      const it = (state.subjectItems[subj] || []).find(x => x.id === id);
      if (!it) return;
      it.status = statusMeta(it.status, subj === 'physics' ? 'physics' : 'task').next;
      saveState();
      render();
    };

    window.deleteSubjectItem = (subj, id) => {
      state.subjectItems[subj] = (state.subjectItems[subj] || []).filter(x => x.id !== id);
      saveState();
      render();
    };

    window.addTrick = (e) => {
      e.preventDefault();
      const subject = document.getElementById('tr-subj').value;
      const trigger = document.getElementById('tr-trigger').value.trim();
      const action = document.getElementById('tr-action').value.trim();
      if (!trigger || !action) return;
      state.tricks.unshift({ id: uid('tr'), subject, trigger, action });
      saveState();
      render();
      toast('Приём добавлен');
    };

    window.deleteTrick = (id) => {
      state.tricks = state.tricks.filter(x => x.id !== id);
      saveState();
      render();
    };

    // Modal
    window.openTaskModal = () => {
      const m = document.getElementById('modal-task');
      m.classList.remove('hidden');
      m.classList.add('flex');
      document.getElementById('f-phase').value = String(detectCurrentPhase());
      document.getElementById('f-title').focus();
    };

    window.closeTaskModal = () => {
      const m = document.getElementById('modal-task');
      m.classList.add('hidden');
      m.classList.remove('flex');
      document.getElementById('form-task').reset();
    };

    document.getElementById('btn-quick-add').addEventListener('click', openTaskModal);
    document.getElementById('form-task').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('f-title').value.trim();
      if (!title) return;
      state.tasks.unshift({
        id: uid('t'),
        title,
        subject: document.getElementById('f-subject').value,
        phase: Number(document.getElementById('f-phase').value),
        kind: document.getElementById('f-kind').value,
        due: document.getElementById('f-due').value,
        note: document.getElementById('f-note').value.trim(),
        today: document.getElementById('f-today').checked,
        status: 'todo'
      });
      saveState();
      closeTaskModal();
      render();
      toast('Задача добавлена');
    });

    document.getElementById('btn-theme').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      saveState();
      applyTheme();
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'spbau-session-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('Бэкап JSON скачан');
    });

    document.getElementById('input-import').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!imported.tasks || !imported.mathKdz) throw new Error('bad format');
          state = { ...deepClone(DEFAULT_STATE), ...imported };
          saveState();
          render();
          toast('Данные восстановлены из JSON');
        } catch (err) {
          toast('Ошибка: неверный формат JSON');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('Сбросить дашборд к исходному состоянию? (Сначала лучше сделать Экспорт)')) return;
      localStorage.removeItem(STORAGE_KEY);
      state = deepClone(DEFAULT_STATE);
      render();
      toast('Сброшено к базовому плану');
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
